<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08101f"><meta name="description" content="Portal Flow is a one-finger crystal sorting puzzle."><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Portal Flow</title></head>
<body><main class="app"><header class="topbar"><div class="brand"><span class="brand__mark">P</span><span><strong>Portal Flow</strong><small>Arcane sorting puzzle</small></span></div><div class="topbar__actions"><span class="coins" aria-label="Coins">◆ <b id="coins">0</b></span><button class="icon-button" id="settingsButton" aria-label="Open settings">⚙</button></div></header>
<section class="mission" aria-labelledby="levelTitle"><div><p class="eyebrow" id="chapter">THE FIRST RIFT</p><h1 id="levelTitle">Level <span id="level">1</span></h1><p id="objective">Collect three matching crystals.</p></div><div class="mission__stats"><span><small>STREAK</small><b id="combo">×1</b></span><span><small>SCORE</small><b id="score">0</b></span></div><div class="progress"><i id="progress"></i></div></section>
<section class="board" id="boardWrap" aria-label="Crystal stacks"><div class="stacks" id="stacks"></div><div class="tray-heading"><span>PORTAL BELT</span><b id="beltCount">0 / 5</b></div><div class="tray" id="tray"></div><div class="tools"><button id="undo"><b>↶</b><span>Undo</span><small id="undoCount">1</small></button><button id="hint"><b>✦</b><span>Hint</span><small id="hintCount">2</small></button><button id="extra"><b>＋</b><span>Slot</span><small id="extraCount">1</small></button></div><p class="tip" id="tip">Tap any exposed crystal.</p></section></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div><dialog id="resultDialog" class="modal"><div class="orb"></div><p class="eyebrow" id="resultEyebrow">RIFT SEALED</p><h2 id="resultTitle">Portal restored!</h2><div class="stars" id="stars">★★★</div><p id="resultText"></p><button class="primary" id="primaryAction">Next level</button><button class="secondary" id="secondaryAction">Replay</button></dialog>
<dialog id="settingsDialog" class="sheet"><form method="dialog"><header><h2>Settings</h2><button class="icon-button" aria-label="Close">×</button></header><label><span>Sound</span><input id="soundToggle" type="checkbox" checked></label><label><span>Haptics</span><input id="hapticsToggle" type="checkbox" checked></label><label><span>Reduced motion</span><input id="motionToggle" type="checkbox"></label><button type="button" class="danger-button" id="resetButton">Reset progress</button></form></dialog><script type="module" src="app.mjs"></script></body></html>
